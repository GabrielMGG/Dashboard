<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <div class="container">
        <h1>Dashboard Admin</h1>

        <div class="controls">
            <div class="search-box">
                <input id="buscar" type="text" placeholder="Buscar usuário...">
            </div>

            <div class="filters">
                <select>
                    <option value="1">Todos</option>
                    <option value="2">Status: Ativo</option>
                    <option value="3">Status: Inativo</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Empresa</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">

                </tbody>
            </table>
        </div>

        <div class="pagination">
            <button class="anterior">&lt; Anterior</button>
            <button data-page="1" value="1">1</button>
            <button data-page="2" value="2">2</button>
            <button data-page="3" value="3">3</button>
            <button class="proximo">Próximo &gt;</button>
        </div>
    </div>




    <dialog id="editar-modal">
        <div class="modal-header">
            <div class="user-icon-circle">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z">
                    </path>
                </svg>
            </div>
            <h2>Editar usuário</h2> <button class="close-modal">&times;</button>
        </div>

        <hr class="divider">

        <form method="dialog" class="modal-body">
            <div class="info-group">
                <div class="info-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path>
                    </svg>
                </div>
                <div class="text-group">
                    <label for="input-nome">Nome</label>
                    <input type="text" id="input-nome" placeholder="Digite o nome...">
                </div>
            </div>

            <div class="info-group">
                <div class="info-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                        <polyline points="22,6 12,13 2,6"></polyline>
                    </svg>
                </div>
                <div class="text-group">
                    <label for="input-email">Email</label>
                    <input type="email" id="input-email" placeholder="email@exemplo.com">
                </div>
            </div>

            <div class="info-group">
                <div class="info-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21V5a2 2 0 0 0-2-2H7a2 2 0 0 0-2 2v16"></path>
                        <path d="M11 21V12h2v9"></path>
                    </svg>
                </div>
                <div class="text-group">
                    <label for="input-empresa">Empresa</label>
                    <input type="text" id="input-empresa" placeholder="Nome da empresa">
                </div>
            </div>

            <div class="info-group">
                <div class="info-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5z"></path>
                    </svg>
                </div>
                <div class="text-group">
                    <label>Status</label>
                    <span id="span-status" class="badge status-active">
                        <span id="bolinha" class="status-dot-ativo"></span>
                        <span id="info-status">Ativo</span>
                    </span>
                </div>
            </div>
        </form>

        <hr class="divider">

        <div class="modal-footer">
            <button id="btn-save">Salvar alterações</button>
        </div>
    </dialog>
    <script src="assets/js/script.js"></script>
</body>

</html>
